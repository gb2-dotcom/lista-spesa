<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>Lista della spesa</title>
</head>
<body>
  <h1>Lista della spesa</h1>

  <form id="form-aggiungi">
    <input id="input-voce" type="text" placeholder="Es. latte" required>
    <button type="submit">Aggiungi</button>
  </form>

  <ul id="lista"></ul>
  
  <div id="banner-aggiornamento" role="status" hidden>
    <span>Nuova versione disponibile</span>
    <button id="bottone-ricarica" type="button">Ricarica</button>
  </div>
  
  <script src="js/app.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').then((registration) => {

            const bottone = document.getElementById('bottone-ricarica');
            let workerInAttesa = null;

            bottone.addEventListener('click', () => {
                console.log('Click: invio messaggio al worker in attesa');
                if (workerInAttesa) {
                    workerInAttesa.postMessage('SALTA_ATTESA');
                }
            });

            if (registration.waiting) {
                mostraBanner(registration.waiting);
            }

            registration.addEventListener('updatefound', () => {
                const nuovoWorker = registration.installing;
                console.log('Trovato un nuovo service worker, sta installando…');

                nuovoWorker.addEventListener('statechange', () => {

                    if (nuovoWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        mostraBanner(registration.waiting);
                    }
                });
            });

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                console.log('Nuovo service worker al comando: ricarico');
                window.location.reload();
            });

            function mostraBanner(worker) {
                workerInAttesa = worker;
                document.getElementById('banner-aggiornamento').hidden = false;
            }

        }).catch((errore) => {
            console.error('Registrazione del service worker fallita', errore);
        });
    }
  </script>
</body>
</html>
