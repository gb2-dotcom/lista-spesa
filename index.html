<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lista della spesa da installare sul telefono: aggiungi le voci, cancellale quando le hai prese. Funziona anche senza connessione.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>Lista della spesa</title>
</head>
<body>
  <!-- tabindex="-1" per poterci riportare il focus dopo aver cancellato
       le completate: il bottone che si è toccato sparisce insieme a loro. -->
  <h1 tabindex="-1">Lista della spesa</h1>

  <main>
    <form id="form-aggiungi">
      <!-- Il placeholder da solo farebbe da nome accessibile, ma sparisce
           appena si scrive: chi usa lo screen reader e torna sul campo a
           metà non saprebbe più cosa ci va. L'etichetta è nascosta alla
           vista perché il titolo della pagina la dice già. -->
      <label class="solo-lettori" for="input-voce">Nuova voce</label>
      <input id="input-voce" type="text" placeholder="Es. latte" required>
      <button type="submit">Aggiungi</button>
    </form>

    <ul id="lista"></ul>

    <!-- details/summary danno gratis apertura al tocco, gestione da
         tastiera e l'annuncio di espanso/compresso. -->
    <details id="sezione-completate" hidden>
      <summary><h2>Completate (<span id="conteggio-completate">0</span>)</h2></summary>
      <button id="cancella-completate" type="button">Cancella le completate</button>
      <ul id="lista-completate"></ul>
    </details>
  </main>
  
  <div id="banner-aggiornamento" role="status" hidden>
    <span>Nuova versione disponibile</span>
    <button id="bottone-ricarica" type="button">Ricarica</button>
  </div>
  
  <script src="js/app.js"></script>
  
  <script src="js/registra-sw.js"></script>
</body>
</html>
