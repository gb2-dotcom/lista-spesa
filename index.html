<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Lista della spesa da installare sul telefono: aggiungi le voci, cancellale quando le hai prese. Funziona anche senza connessione.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <title>Lista della spesa</title>
</head>
<body>
  <h1>Lista della spesa</h1>

  <main>
    <form id="form-aggiungi">
      <input id="input-voce" type="text" placeholder="Es. latte" required>
      <button type="submit">Aggiungi</button>
    </form>

    <ul id="lista"></ul>
  </main>
  
  <div id="banner-aggiornamento" role="status" hidden>
    <span>Nuova versione disponibile</span>
    <button id="bottone-ricarica" type="button">Ricarica</button>
  </div>
  
  <script src="js/app.js"></script>
  
  <script src="js/registra-sw.js"></script>
</body>
</html>
